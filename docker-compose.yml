services:
  geo-alerts:
    build:
      context: .
      dockerfile: Dockerfile
      # Client REACT_APP_* values come from a BuildKit secret, not build args (keeps them out of image history).
      secrets:
        - client_env
    image: geo-alerts-server
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.5"
    pids_limit: 256
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ASP.NET Core environment
      ASPNETCORE_ENVIRONMENT: "Production"

      # DB connection (from DATABASE_URL in .env)
      ConnectionStrings__DefaultDatabase: "${DATABASE_URL}"

      # App-level config (replaces HTTP_PORT, CLIENT_BASE_URL, CORS_ORIGIN)
      App__ClientBaseUrl: "https://geo-alerts.toxic-ground-zero.com"
      App__WebSocketPath: "/ws"
      # CORS not usually needed in prod since SPA + API share origin; set only if required:
      # App__CorsOrigin: "https://geo-alerts.toxic-ground-zero.com"

      # Feature flags
      Features__EnableTelegram: "${ENABLE_TELEGRAM}"
      USE_OREF_MOCK: "${USE_OREF_MOCK}"
      News__CachePath: /app/cache/news.json
      OREF_URL: "${OREF_URL}"
      # Toolbar: server serves this at GET /api/config. Use "true" or leave unset (defaults to false).
      App__ActiveToolbar: "${ACTIVE_TOOLBAR:-false}"

      # Screenshot
      Screenshot__StoragePath: "${SCREENSHOT_STORAGE_PATH}"
      Screenshot__PublicUrl: "${SCREENSHOT_PUBLIC_URL}"
      Screenshot__MinAreas: "${SCREENSHOT_MIN_AREAS}"
      Screenshot__MinMatchedSettlements: "${SCREENSHOT_MIN_MATCHED_SETTLEMENTS}"
      Screenshot__AlertTitle: "${SCREENSHOT_ALERT_TITLE}"
      Screenshot__CooldownMs: "${SCREENSHOT_COOLDOWN_MS}"

      # Telegram
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      Telegram__ChannelId: "${TELEGRAM_CHANNEL_ID}"
      Telegram__ApiId: "${TELEGRAM_API_ID}"
      Telegram__ApiHash: "${TELEGRAM_API_HASH}"

      # Geo / geocode
      GeoData__ClientDataDir: "${CLIENT_DATA_DIR}"
      Geocode__BaseUrl: "${GEOCODE_BASE}"
      Geocode__NominatimUrl: "${NOMINATIM_URL}"

    volumes:
      # Mount client-data (public/data etc.) into the container
      - ./public/data:/app/client-data:ro
      # Persistent last-good news cache (survives container recreation)
      - news-cache:/app/cache
      # Optional: screenshots directory
      - ./screenshots:/app/screenshots
secrets:
  client_env:
    # Optional file with REACT_APP_* lines (gitignored). Create empty if unused.
    file: ./client/.env.production

volumes:
  news-cache:
