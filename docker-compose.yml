services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Browser will call these on the host; map server ports in docker-compose
        REACT_APP_API_BASE: http://localhost:8090
        REACT_APP_WS_URL: ws://localhost:5535
    ports:
      - "4421:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8090:8090"   # HTTP API
      - "5535:5535"   # WebSocket
    environment:
      PORT: 5535
      HTTP_PORT: 8090
      # Allow browser at client port to call API (CORS)
      CORS_ORIGIN: http://localhost:3000
      # Point to Postgres (use db service or host)
      DATABASE_URL: postgres://app:app@db:5432/bets
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: bets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
