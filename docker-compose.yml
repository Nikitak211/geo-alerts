version: "3.9"

services:
  geo-alerts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Client build (optional; toolbar can also be set at runtime via ACTIVE_TOOLBAR + GET /api/config).
        REACT_APP_ACTIVE_TOOLBAR: ${ACTIVE_TOOLBAR:-}
        REACT_APP_GEOAPIFY_API_KEY: ${REACT_APP_GEOAPIFY_API_KEY:-}
        REACT_APP_OREF_TRAJECTORY_DEBUG: ${REACT_APP_OREF_TRAJECTORY_DEBUG:-}
        REACT_APP_CESIUM_ION_ACCESS_TOKEN: ${REACT_APP_CESIUM_ION_ACCESS_TOKEN:-}
    image: geo-alerts-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # ASP.NET Core environment
      ASPNETCORE_ENVIRONMENT: "Production"

      # DB connection (from DATABASE_URL in .env)
      ConnectionStrings__DefaultDatabase: "${DATABASE_URL}"

      # App-level config (replaces HTTP_PORT, CLIENT_BASE_URL, CORS_ORIGIN)
      App__ClientBaseUrl: "http://localhost:8080"
      App__WebSocketPath: "/ws"
      # CORS not usually needed in prod since SPA + API share origin; set only if required:
      # App__CorsOrigin: "http://localhost:8080"

      # Feature flags
      Features__EnableTelegram: "${ENABLE_TELEGRAM}"
      Features__EnableBets: "${ENABLE_BETS}"
      App__UseOrefMock: "${USE_OREF_MOCK}"
      # Toolbar: server serves this at GET /api/config so client shows toolbar at runtime (no rebuild needed).
      App__ActiveToolbar: "${ACTIVE_TOOLBAR}"

      # Betting
      Betting__ExpiryGraceMs: "${BET_EXPIRY_GRACE_MS}"
      Betting__ProximityExpiryGraceMs: "${BET_PROXIMITY_EXPIRY_GRACE_MS}"
      Betting__ExpiryLoopIntervalMs: "${BET_EXPIRY_LOOP_INTERVAL_MS}"
      Betting__RegionPayoutMultiplier: "${BET_REGION_PAYOUT_MULTIPLIER}"
      Betting__PlatformFeeRatio: "${BET_PLATFORM_FEE_RATIO}"
      Betting__ExactPoolShare: "${BET_EXACT_POOL_SHARE}"
      Betting__NearWinnerMinutes: "${BET_NEAR_WINNER_MINUTES}"

      # Screenshot
      Screenshot__StoragePath: "${SCREENSHOT_STORAGE_PATH}"
      Screenshot__PublicUrl: "${SCREENSHOT_PUBLIC_URL}"
      Screenshot__MinAreas: "${SCREENSHOT_MIN_AREAS}"
      Screenshot__MinMatchedSettlements: "${SCREENSHOT_MIN_MATCHED_SETTLEMENTS}"
      Screenshot__AlertTitle: "${SCREENSHOT_ALERT_TITLE}"
      Screenshot__CooldownMs: "${SCREENSHOT_COOLDOWN_MS}"

      # Telegram
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      Telegram__ChannelId: "${TELEGRAM_CHANNEL_ID}"
      Telegram__ApiId: "${TELEGRAM_API_ID}"
      Telegram__ApiHash: "${TELEGRAM_API_HASH}"

      # Geo / geocode
      GeoData__ClientDataDir: "${CLIENT_DATA_DIR}"
      Geocode__BaseUrl: "${GEOCODE_BASE}"
      Geocode__NominatimUrl: "${NOMINATIM_URL}"

    volumes:
      # Mount client-data (public/data etc.) into the container
      - ./public/data:/app/client-data:ro
      # Optional: screenshots directory
      - ./screenshots:/app/screenshots