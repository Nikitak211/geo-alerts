# Shared by the Raspberry Pi deploy portal and local Docker Desktop.
# The portal unpacks a zip and runs this file next to deploy.json. Keep Pi behavior
# in this file; do not rely on a compose override.
# deployd sets APP_PORT. Portal env (not committed): POSTGRES_PASSWORD, optional TELEGRAM_*, optional REACT_APP_*.
# Local .env can set the same names. Unset APP_PORT publishes 127.0.0.1:8080.
services:
  geo-alerts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_GEOAPIFY_API_KEY: ${REACT_APP_GEOAPIFY_API_KEY:-}
        REACT_APP_CESIUM_ION_ACCESS_TOKEN: ${REACT_APP_CESIUM_ION_ACCESS_TOKEN:-}
        REACT_APP_OREF_TRAJECTORY_DEBUG: ${REACT_APP_OREF_TRAJECTORY_DEBUG:-}
        REACT_APP_STADIA_MAPS_API_KEY: ${REACT_APP_STADIA_MAPS_API_KEY:-}
    image: geo-alerts-server
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Defaults match the Pi zip (256m, no swap, 128 pids). Raise them in .env on a PC.
    mem_limit: ${GEO_ALERTS_MEM_LIMIT:-256m}
    memswap_limit: ${GEO_ALERTS_MEMSWAP_LIMIT:-256m}
    pids_limit: ${GEO_ALERTS_PIDS_LIMIT:-128}
    restart: unless-stopped
    ports:
      - "${APP_PUBLISH_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DOTNET_GCHeapHardLimit: "${DOTNET_GCHeapHardLimit:-0x9000000}"
      ConnectionStrings__DefaultDatabase: "${DATABASE_URL:-Host=db;Port=5432;Database=geoalerts;Username=app;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}}"
      App__ClientBaseUrl: "https://geo-alerts.toxic-ground-zero.com"
      App__WebSocketPath: "/ws"
      Features__EnableTelegram: "${ENABLE_TELEGRAM:-false}"
      USE_OREF_MOCK: "${USE_OREF_MOCK:-}"
      News__CachePath: /app/cache/news.json
      OREF_URL: "${OREF_URL:-}"
      App__ActiveToolbar: "${ACTIVE_TOOLBAR:-false}"
      Screenshot__StoragePath: "${SCREENSHOT_STORAGE_PATH:-/app/screenshots}"
      Screenshot__PublicUrl: "${SCREENSHOT_PUBLIC_URL:-}"
      Screenshot__MinAreas: "${SCREENSHOT_MIN_AREAS:-}"
      Screenshot__MinMatchedSettlements: "${SCREENSHOT_MIN_MATCHED_SETTLEMENTS:-}"
      Screenshot__AlertTitle: "${SCREENSHOT_ALERT_TITLE:-}"
      Screenshot__CooldownMs: "${SCREENSHOT_COOLDOWN_MS:-}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN:-}"
      Telegram__ChannelId: "${TELEGRAM_CHANNEL_ID:-}"
      Telegram__ApiId: "${TELEGRAM_API_ID:-}"
      Telegram__ApiHash: "${TELEGRAM_API_HASH:-}"
      GeoData__ClientDataDir: "${CLIENT_DATA_DIR:-}"
      Geocode__BaseUrl: "${GEOCODE_BASE:-}"
      Geocode__NominatimUrl: "${NOMINATIM_URL:-}"
    volumes:
      - news-cache:/app/cache
      # Named volume on the Pi. Set SCREENSHOT_VOLUME=./screenshots in .env for a bind mount.
      - ${SCREENSHOT_VOLUME:-screenshots}:/app/screenshots
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: geoalerts
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 128m
    memswap_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d geoalerts"]
      interval: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  news-cache:
  screenshots:
  pgdata:
