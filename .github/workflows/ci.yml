name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            Server/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore geo-alerts.sln

      - name: Test .NET server
        run: dotnet test geo-alerts.sln --configuration Release --no-restore

      - name: Install React client
        run: npm ci --prefix client

      - name: Test React client
        run: npm test --prefix client -- --watchAll=false
        env:
          CI: 'true'

      - name: Build React client
        run: npm run build --prefix client

      - name: Install legacy TypeScript server
        run: npm ci --prefix Server

      - name: Test legacy TypeScript server
        run: npm run test:unit --prefix Server
